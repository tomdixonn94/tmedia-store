name: T Media Support Message Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmedia-support-message-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check google-auth requests

      - name: Check Firestore and send Admin alerts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/check_support_messages.py

      - name: Save notification checkpoint
        run: |
          if git diff --quiet -- support-alerts/support-watch-state.json; then
            echo "No checkpoint changes."
            exit 0
          fi
          git config user.name "T Media Support Watch"
          git config user.email "actions@users.noreply.github.com"
          git add support-alerts/support-watch-state.json
          git commit -m "Update support alert checkpoint"
          git push
