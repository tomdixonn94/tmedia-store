name: T Media Mobile Admin Push

on:
  workflow_dispatch:
    inputs:
      title:
        required: true
        type: string
      body:
        required: true
        type: string
      type:
        required: true
        type: string
      topic:
        required: false
        default: all_users
        type: string
      token:
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Send FCM message
        shell: bash
        env:
          PROJECT_ID: t-media-store
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          TYPE: ${{ inputs.type }}
          TOPIC: ${{ inputs.topic }}
          DEVICE_TOKEN: ${{ inputs.token }}
        run: |
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python3 - <<'PY' > payload.json
          import json, os
          message = {
            "notification": {"title": os.environ["TITLE"], "body": os.environ["BODY"]},
            "data": {"type": os.environ["TYPE"], "title": os.environ["TITLE"], "body": os.environ["BODY"]}
          }
          token = os.environ.get("DEVICE_TOKEN", "").strip()
          if token:
            message["token"] = token
          else:
            message["topic"] = os.environ.get("TOPIC", "all_users")
          print(json.dumps({"message": message}))
          PY
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "https://fcm.googleapis.com/v1/projects/$PROJECT_ID/messages:send"
